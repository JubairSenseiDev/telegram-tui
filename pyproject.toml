[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-sensei-toolkit"
version = "3.2.0"
description = "A modern Termux-friendly Telegram account management CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "telethon>=1.36.0",
  "rich>=13.7.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
telegram-sensei = "telegram_sensei.cli:run"

[tool.setuptools.packages.find]
where = ["src"]
